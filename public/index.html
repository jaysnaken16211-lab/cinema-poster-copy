<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>電影簡介圖片卡</title>
    <link rel="stylesheet" href="styles.css?v=20260907-pauseposters1" />
  </head>
  <body class="is-locked">
    <section id="authScreen" class="auth-screen" aria-live="polite">
      <form id="authForm" class="auth-box">
        <p class="eyebrow">cinema.com.hk</p>
        <h1>電影簡介圖片卡</h1>
        <label>
          密碼
          <input id="passwordInput" type="password" autocomplete="current-password" />
        </label>
        <button type="submit">進入</button>
        <p id="authError" class="auth-error"></p>
      </form>
    </section>

    <main id="appShell" class="app" aria-hidden="true">
      <section class="topbar">
        <div>
          <p class="eyebrow">cinema.com.hk</p>
          <h1>電影簡介圖片卡</h1>
        </div>
        <div class="controls">
          <div class="mode-switch" role="group" aria-label="圖片類型">
            <button id="storyModeBtn" class="mode-button is-active" type="button" data-mode="story">故事簡介圖片</button>
            <button id="pauseModeBtn" class="mode-button" type="button" data-mode="pause">優惠暫停</button>
          </div>
          <button id="refreshBtn">刷新電影</button>
        </div>
      </section>

      <section class="layout">
        <aside class="poster-panel">
          <div class="panel-head">
            <h2 id="posterPanelTitle">點擊 Poster</h2>
            <span id="countLabel">載入中</span>
          </div>
          <div id="posterGrid" class="poster-grid"></div>
        </aside>

        <section class="preview-panel">
          <div class="panel-head">
            <h2 id="previewTitle">圖片預覽</h2>
            <div class="actions">
              <button id="copyBtn">複製圖片</button>
              <button id="downloadBtn">下載 PNG</button>
            </div>
          </div>

          <article id="card" class="movie-card" aria-live="polite">
            <div class="card-poster-wrap">
              <img id="cardPoster" alt="" />
            </div>
            <div class="card-body">
              <p id="cardMeta" class="meta"></p>
              <h2 id="titleZh"></h2>
              <p id="synopsisZh" class="synopsis"></p>
              <p id="creditsZhLine" class="credits-line"></p>
              <div class="rule"></div>
              <h3 id="titleEn"></h3>
              <p id="synopsisEn" class="synopsis en"></p>
              <p id="creditsEnLine" class="credits-line en"></p>
              <p id="sourceLine" class="source-line"></p>
            </div>
          </article>

          <article id="pauseCard" class="movie-card pause-card" aria-live="polite" hidden>
            <section class="pause-copy-area">
              <label class="visually-hidden" for="pauseMessage">優惠暫停文字</label>
              <textarea id="pauseMessage" maxlength="180" spellcheck="false">優惠暫停</textarea>
            </section>
            <section class="pause-poster-area">
              <div id="pausePosterGrid" class="pause-poster-grid"></div>
              <p id="pauseEmpty" class="pause-empty">未選擇電影</p>
            </section>
          </article>
          <p id="status" class="status">準備中...</p>
        </section>
      </section>
    </main>

    <script src="app.js?v=20260907-pauseposters1" type="module"></script>
  </body>
</html>
