name: Update Movies And Deploy Pages

on:
  workflow_dispatch:
  schedule:
    # Hong Kong (UTC+8): 00:00, 12:30, 18:30.
    - cron: "0 16 * * *"
    - cron: "30 4,10 * * *"
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test cinema parser
        run: node --test tests/cinema-data.test.js

      - name: Fetch cinema data
        run: npm run fetch:data
        env:
          CINEMA_IDS: "5"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
